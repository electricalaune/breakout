<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>超高速ブロック崩し</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f1f1f4;--fg:#15151c;--mute:#666}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b12;--fg:#eaeaf2;--mute:#9a9ab0}}
:root[data-theme="dark"]{--bg:#0b0b12;--fg:#eaeaf2;--mute:#9a9ab0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow:hidden;touch-action:none}
#hud{display:flex;gap:18px;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
canvas{background:#0b0b12;border:2px solid #ff3d7f;border-radius:8px;max-width:100%;touch-action:none;cursor:none;box-shadow:0 0 24px #ff3d7f55}
small{color:var(--mute)}
</style>
</head>
<body>
<div id="hud"><span id="sc">SCORE 0</span><span id="lv">LV 1</span><span id="li">♥♥♥</span><span id="hi">BEST 0</span></div>
<canvas id="c" width="480" height="640"></canvas>
<small>マウス／タッチ／←→で操作・クリックかスペースで発射</small>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=480,H=640;
function fit(){const h=window.innerHeight-90,w=window.innerWidth-16,s=Math.min(h/H,w/W);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
fit();addEventListener('resize',fit);
let best=0;try{best=+localStorage.getItem('brk_best')||0}catch(e){}
const COLS=10,BW=44,BH=18,GAP=2,OX=(W-COLS*(BW+GAP)+GAP)/2;
const PY=596,PH=10;
let S;
function newWall(lv){
  const rows=Math.min(5+Math.floor(lv/2),9),b=[];
  for(let r=0;r<rows;r++)for(let c=0;c<COLS;c++){
    if(lv>1&&Math.random()<0.08)continue;
    b.push({x:OX+c*(BW+GAP),y:60+r*(BH+GAP),hp:r<2+Math.floor(lv/2)?2:1,hue:r*32});
  }
  return b;
}
function init(){
  S={score:0,lv:1,lives:3,bricks:newWall(1),px:W/2,pw:72,ball:null,speed:430,drop:0,over:false,state:'ready',t:0,tx:W/2};
  S.ball={x:W/2,y:PY-8,vx:0,vy:0,r:6,trail:[]};
}
function launch(){
  if(S.over){init();return}
  if(S.state==='ready'){
    const a=-Math.PI/2+(Math.random()*0.8-0.4);
    S.ball.vx=Math.cos(a)*S.speed;S.ball.vy=Math.sin(a)*S.speed;S.state='play';
  }
}
function pos(e){const r=cv.getBoundingClientRect();return (e.clientX-r.left)/r.width*W}
cv.addEventListener('pointermove',e=>{S.tx=pos(e)});
cv.addEventListener('pointerdown',e=>{S.tx=pos(e);launch()});
const keys={};
addEventListener('keydown',e=>{keys[e.key]=1;if(e.key===' '){launch();e.preventDefault()}});
addEventListener('keyup',e=>keys[e.key]=0);
function nextLevel(){
  S.lv++;S.bricks=newWall(S.lv);S.speed=Math.min(430+S.lv*45,900);
  S.pw=Math.max(40,72-S.lv*4);S.drop=0;S.state='ready';
  S.ball={x:S.px,y:PY-8,vx:0,vy:0,r:6,trail:[]};
}
function loseBall(){
  S.lives--;
  if(S.lives<=0){S.over=true;try{if(S.score>best){best=S.score;localStorage.setItem('brk_best',best)}}catch(e){}return}
  S.state='ready';S.ball={x:S.px,y:PY-8,vx:0,vy:0,r:6,trail:[]};
}
function step(dt){
  S.t+=dt;
  if(keys.ArrowLeft||keys.a)S.tx-=650*dt;
  if(keys.ArrowRight||keys.d)S.tx+=650*dt;
  S.tx=Math.max(S.pw/2,Math.min(W-S.pw/2,S.tx));
  S.px+=(S.tx-S.px)*Math.min(1,dt*40);
  const B=S.ball;
  if(S.state==='ready'){B.x=S.px;B.y=PY-8;return}
  // bricks descend
  S.drop+=dt;
  const period=Math.max(4,11-S.lv*0.9);
  if(S.drop>period){S.drop=0;S.bricks.forEach(k=>k.y+=BH/2);}
  if(S.bricks.some(k=>k.y+BH>=PY-4)){S.over=true;try{if(S.score>best){best=S.score;localStorage.setItem('brk_best',best)}}catch(e){}return}
  const sp=Math.hypot(B.vx,B.vy),n=Math.ceil(sp*dt/3);
  for(let i=0;i<n;i++){
    B.x+=B.vx*dt/n;B.y+=B.vy*dt/n;
    if(B.x<B.r){B.x=B.r;B.vx=Math.abs(B.vx)}
    if(B.x>W-B.r){B.x=W-B.r;B.vx=-Math.abs(B.vx)}
    if(B.y<B.r){B.y=B.r;B.vy=Math.abs(B.vy)}
    // paddle
    if(B.vy>0&&B.y+B.r>=PY&&B.y-B.r<=PY+PH&&Math.abs(B.x-S.px)<=S.pw/2+B.r){
      const h=(B.x-S.px)/(S.pw/2),a=h*1.15,spd=Math.min(sp*1.012,1150);
      B.vx=Math.sin(a)*spd;B.vy=-Math.cos(a)*spd;B.y=PY-B.r;
    }
    if(B.y>H+20){loseBall();return}
    for(let j=0;j<S.bricks.length;j++){
      const k=S.bricks[j],cx=Math.max(k.x,Math.min(B.x,k.x+BW)),cy=Math.max(k.y,Math.min(B.y,k.y+BH));
      const dx=B.x-cx,dy=B.y-cy;
      if(dx*dx+dy*dy<B.r*B.r){
        if(Math.abs(dx)>Math.abs(dy))B.vx=dx>0?Math.abs(B.vx):-Math.abs(B.vx);
        else B.vy=dy>0?Math.abs(B.vy):-Math.abs(B.vy);
        k.hp--;S.score+=10*S.lv;
        const m=1.006;B.vx*=m;B.vy*=m;
        if(k.hp<=0)S.bricks.splice(j,1);
        break;
      }
    }
    if(!S.bricks.length){nextLevel();return}
  }
  B.trail.push([B.x,B.y]);if(B.trail.length>10)B.trail.shift();
}
function draw(){
  g.clearRect(0,0,W,H);
  S.bricks.forEach(k=>{
    g.fillStyle=`hsl(${k.hue+300},90%,${k.hp>1?72:55}%)`;
    g.fillRect(k.x,k.y,BW,BH);
    if(k.hp>1){g.strokeStyle='#fff';g.lineWidth=2;g.strokeRect(k.x+1,k.y+1,BW-2,BH-2)}
  });
  // danger line
  g.strokeStyle='#ff3d7f44';g.setLineDash([6,6]);g.beginPath();g.moveTo(0,PY-4);g.lineTo(W,PY-4);g.stroke();g.setLineDash([]);
  g.fillStyle='#00e5ff';g.shadowColor='#00e5ff';g.shadowBlur=14;
  g.fillRect(S.px-S.pw/2,PY,S.pw,PH);
  const B=S.ball;
  B.trail.forEach((p,i)=>{g.globalAlpha=i/B.trail.length*0.4;g.beginPath();g.arc(p[0],p[1],B.r*(i/B.trail.length),0,7);g.fill()});
  g.globalAlpha=1;g.fillStyle='#fff';g.beginPath();g.arc(B.x,B.y,B.r,0,7);g.fill();g.shadowBlur=0;
  g.textAlign='center';g.fillStyle='#fff';
  if(S.over){
    g.fillStyle='#000a';g.fillRect(0,0,W,H);g.fillStyle='#ff3d7f';g.font='bold 44px sans-serif';g.fillText('GAME OVER',W/2,280);
    g.fillStyle='#fff';g.font='20px sans-serif';g.fillText('SCORE '+S.score+'　LV '+S.lv,W/2,325);g.fillText('クリックでリトライ',W/2,365);
  }else if(S.state==='ready'){
    g.font='bold 20px sans-serif';g.fillText('LEVEL '+S.lv+'　クリックで発射',W/2,400);
  }
  document.getElementById('sc').textContent='SCORE '+S.score;
  document.getElementById('lv').textContent='LV '+S.lv;
  document.getElementById('li').textContent='♥'.repeat(Math.max(0,S.lives));
  document.getElementById('hi').textContent='BEST '+Math.max(best,S.score);
}
init();
let last=performance.now(),acc=0;
function loop(t){
  acc+=Math.min(0.05,(t-last)/1000);last=t;
  while(acc>=1/120){if(!S.over)step(1/120);acc-=1/120}
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
